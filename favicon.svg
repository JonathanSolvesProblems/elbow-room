<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Elbow Room">
  <title>Elbow Room</title>
  <!-- The turn, in plan: a corridor that goes right, then up. -->
  <rect width="32" height="32" rx="7" fill="#1c1a17"/>
  <path d="M4.5 25.5 H20 V6.5"
        fill="none" stroke="#efeae1" stroke-width="7.5" stroke-linecap="square"/>
  <!-- And the thing that will not go round it. -->
  <path d="M12 29 L25 16"
        fill="none" stroke="#d4553a" stroke-width="4.5" stroke-linecap="round"/>
</svg>
